<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${title}">Document</title>
</head>
<body>
  <!-- Mostrar el título pasado desde el controlador usando Thymeleaf -->
  <h1 th:text="${title}"></h1>
  <ul>
    <!-- Mostrar los datos del objeto user usando la sintaxis de Spring EL -->
    <li th:text="${user.name}"></li>
    <li th:text="${user.lastName}"></li>
  </ul>
</body>
</html>
